name: Build ChadNotes APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Signed APK Directly via Android SDK
        run: |
          set -e
          find . -maxdepth 3 -name "*.zip" -exec unzip -o {} \; || true
          HTML_FILE=$(find . -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: ChadNotes_Android_Studio_Project.zip is missing! Upload it in the Code tab."
            exit 1
          fi

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLATFORM_DIR=$(ls -d "$ANDROID_HOME/platforms/android-"* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"

          rm -rf /tmp/apkbuild
          mkdir -p /tmp/apkbuild/src/com/chadnotes/pad3 /tmp/apkbuild/gen /tmp/apkbuild/obj /tmp/apkbuild/compiled /tmp/apkbuild/assets /tmp/apkbuild/res/mipmap-xxxhdpi

          cp "$HTML_FILE" /tmp/apkbuild/assets/chadnotes_tablet.html
          ICON_PNG=$(find . -name "ic_launcher.png" | sort | tail -n 1)
          cp "$ICON_PNG" /tmp/apkbuild/res/mipmap-xxxhdpi/ic_launcher.png
          cp "$ICON_PNG" /tmp/apkbuild/res/mipmap-xxxhdpi/ic_launcher_round.png

          cd /tmp/apkbuild

          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.chadnotes.pad3" android:versionCode="12" android:versionName="12.0">
            <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application android:allowBackup="true" android:hardwareAccelerated="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="ChadNotes" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name="com.chadnotes.pad3.MainActivity" android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|density" android:exported="true" android:hardwareAccelerated="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>' > AndroidManifest.xml

          echo 'package com.chadnotes.pad3;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.*;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED);
                  webView = new WebView(this);
                  setContentView(webView);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController c = getWindow().getInsetsController();
                      if (c != null) {
                          c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  }
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new AndroidChadBridge(), "AndroidChadBridge");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest r) {
                          if (r != null) r.grant(r.getResources());
                      }
                  });
                  webView.loadUrl("file:///android_asset/chadnotes_tablet.html");
              }
              @Override
              public void onBackPressed() {
                  if (webView != null) webView.evaluateJavascript("closeAllPopovers(); closeContextDropdowns();", null);
                  else super.onBackPressed();
              }
              public class AndroidChadBridge {
                  @JavascriptInterface
                  public void saveStorageItem(String k, String v) {
                      getSharedPreferences("ChadNotesNativePrefs", MODE_PRIVATE).edit().putString(k, v).apply();
                  }
                  @JavascriptInterface
                  public String getStorageItem(String k) {
                      return getSharedPreferences("ChadNotesNativePrefs", MODE_PRIVATE).getString(k, "");
                  }
                  @JavascriptInterface
                  public void saveBase64File(String dataUrl, final String fileName, String mime) {
                      try {
                          int idx = dataUrl.indexOf("base64,");
                          byte[] bytes = Base64.decode(idx >= 0 ? dataUrl.substring(idx + 7) : dataUrl, Base64.DEFAULT);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                              v.put(MediaStore.Downloads.MIME_TYPE, mime);
                              v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ChadNotes");
                              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (u != null) {
                                  OutputStream os = getContentResolver().openOutputStream(u);
                                  if (os != null) { os.write(bytes); os.close(); }
                              }
                          }
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  Toast.makeText(MainActivity.this, "Saved to Downloads/ChadNotes/" + fileName, Toast.LENGTH_LONG).show();
                              }
                          });
                      } catch (Exception e) {}
                  }
              }
          }' > src/com/chadnotes/pad3/MainActivity.java

          "$BUILD_TOOLS/aapt2" compile res/mipmap-xxxhdpi/ic_launcher.png -o compiled/
          "$BUILD_TOOLS/aapt2" compile res/mipmap-xxxhdpi/ic_launcher_round.png -o compiled/
          "$BUILD_TOOLS/aapt2" link -o unsigned.apk -I "$ANDROID_JAR" compiled/*.flat --manifest AndroidManifest.xml -A assets --java gen
          javac -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -cp "$ANDROID_JAR" -d obj $(find src gen -name "*.java") || javac -source 11 -target 11 -cp "$ANDROID_JAR" -d obj $(find src gen -name "*.java")
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_JAR" --output . $(find obj -name "*.class")
          zip -uj unsigned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias chad -storepass chadnotes123 -keypass chadnotes123 -dname "CN=ChadNotes, OU=Pad3, O=ChadNotes, L=City, S=State, C=US"
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass pass:chadnotes123 --key-pass pass:chadnotes123 --v1-signing-enabled true --v2-signing-enabled true --out "$GITHUB_WORKSPACE/ChadNotes-Signed.apk" aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChadNotes-Signed-APK
          path: ChadNotes-Signed.apk

      - name: Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ChadNotes Signed APK (Build #${{ github.run_number }})"
          files: ChadNotes-Signed.apk
