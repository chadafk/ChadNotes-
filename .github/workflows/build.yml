name: Build ChadNotes APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Extract ZIP & Build Signed APK
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          if [ -d "ChadNotes" ]; then cd ChadNotes; fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/ChadNotes-Signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChadNotes-Signed-APK
          path: ChadNotes-Signed.apk
      - name: Publish Direct APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ChadNotes Signed APK (Build #${{ github.run_number }})"
          files: ChadNotes-Signed.apk
